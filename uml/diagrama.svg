<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="560" font-family="Consolas, monospace" font-size="13">
  <rect width="1060" height="560" fill="#ffffff"/>

  <!-- Conexion -->
  <g>
    <rect x="40" y="40" width="270" height="110" fill="#eef4ff" stroke="#2c3e50" stroke-width="1.5"/>
    <line x1="40" y1="70" x2="310" y2="70" stroke="#2c3e50"/>
    <line x1="40" y1="90" x2="310" y2="90" stroke="#2c3e50"/>
    <text x="175" y="58" text-anchor="middle" font-weight="bold">Conexion</text>
    <text x="50" y="84">- instancia : ?PDO {static}</text>
    <text x="50" y="108">- __construct()</text>
    <text x="50" y="128">+ obtener() : PDO {static}</text>
  </g>

  <!-- PDO externo -->
  <g>
    <rect x="390" y="40" width="150" height="70" fill="#f5f5f5" stroke="#7f8c8d" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="465" y="62" text-anchor="middle" font-style="italic" font-size="11">&#171;PHP nativa&#187;</text>
    <text x="465" y="84" text-anchor="middle" font-weight="bold">PDO</text>
  </g>

  <!-- Libro -->
  <g>
    <rect x="40" y="220" width="440" height="250" fill="#eefbf0" stroke="#2c3e50" stroke-width="1.5"/>
    <line x1="40" y1="250" x2="480" y2="250" stroke="#2c3e50"/>
    <line x1="40" y1="270" x2="480" y2="270" stroke="#2c3e50"/>
    <text x="260" y="238" text-anchor="middle" font-weight="bold">Libro</text>
    <text x="50" y="264">- pdo : PDO</text>
    <text x="50" y="288">+ __construct(pdo: PDO)</text>
    <text x="50" y="308">+ todos() : array</text>
    <text x="50" y="328">+ porId(id: int) : ?array</text>
    <text x="50" y="348">+ disponibles() : array</text>
    <text x="50" y="368">+ crear(titulo, autor, isbn, anio) : int</text>
    <text x="50" y="388">+ actualizar(id, titulo, autor, isbn, anio) : bool</text>
    <text x="50" y="408">+ marcarDisponible(id: int, disponible: bool) : bool</text>
    <text x="50" y="428">+ eliminar(id: int) : bool</text>
  </g>

  <!-- Prestamo -->
  <g>
    <rect x="580" y="220" width="430" height="220" fill="#fff8ec" stroke="#2c3e50" stroke-width="1.5"/>
    <line x1="580" y1="250" x2="1010" y2="250" stroke="#2c3e50"/>
    <line x1="580" y1="270" x2="1010" y2="270" stroke="#2c3e50"/>
    <text x="795" y="238" text-anchor="middle" font-weight="bold">Prestamo</text>
    <text x="590" y="264">- pdo : PDO</text>
    <text x="590" y="288">+ __construct(pdo: PDO)</text>
    <text x="590" y="308">+ porId(id: int) : ?array</text>
    <text x="590" y="328">+ porLibro(libroId: int) : array</text>
    <text x="590" y="348">+ activos() : array</text>
    <text x="590" y="368">+ tienePrestamoActivo(libroId: int) : bool</text>
    <text x="590" y="388">+ crear(libroId, nombreSocio, fechaPrestamo) : int</text>
    <text x="590" y="408">+ devolver(id: int, fechaDevolucion: string) : bool</text>
  </g>

  <!-- Relacion Libro a Prestamo, uno a muchos -->
  <line x1="480" y1="330" x2="580" y2="330" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="486" y="322" font-size="11">1</text>
  <text x="550" y="322" font-size="11">0..*</text>
  <text x="486" y="345" font-size="10" font-style="italic">historial de</text>

  <!-- Dependencias hacia PDO, linea discontinua con flecha abierta -->
  <line x1="300" y1="220" x2="440" y2="110" stroke="#7f8c8d" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="760" y1="220" x2="500" y2="110" stroke="#7f8c8d" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="310" y1="90" x2="390" y2="75" stroke="#2c3e50" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="320" y="78" font-size="10" font-style="italic">crea / devuelve</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#7f8c8d" stroke-width="1"/>
    </marker>
  </defs>

  <!-- Notas -->
  <rect x="550" y="40" width="330" height="70" fill="#fffbe6" stroke="#c9b458" stroke-width="1"/>
  <text x="560" y="56" font-size="11">Singleton: obtener() siempre devuelve la</text>
  <text x="560" y="72" font-size="11">misma instancia PDO. index.php la usa para</text>
  <text x="560" y="88" font-size="11">inyectar el PDO en Libro y Prestamo.</text>

  <rect x="40" y="490" width="440" height="60" fill="#fffbe6" stroke="#c9b458" stroke-width="1"/>
  <text x="50" y="508" font-size="11">libro_id enlaza cada prestamo con un libro (FK en la BD).</text>
  <text x="50" y="526" font-size="11">fecha_devolucion = NULL significa que el prestamo esta activo.</text>
</svg>
